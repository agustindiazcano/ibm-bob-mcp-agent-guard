name: CD — Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "web-next/**"
      - "docs/ARCHITECTURE-front.md"
      - "PENDING-front.md"
  workflow_dispatch: {}

# Requires repo-level configuration a human sets up once — see docs/DEPLOY.md.
# Variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID   e.g. testmind-ai-hackathon
#   GCP_REGION       e.g. us-central1
#   GAR_REPOSITORY   Artifact Registry repo name, e.g. repoguard
#   CLOUD_RUN_SERVICE  Cloud Run service name, e.g. repoguard
# Secrets:
#   GCP_SA_KEY       JSON key for a service account with
#                    roles/artifactregistry.writer + roles/run.admin +
#                    roles/iam.serviceAccountUser

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/repoguard:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated

      - name: Show live URL
        run: echo "Deployed — check the Cloud Run console or the deploy step output above for the service URL."
