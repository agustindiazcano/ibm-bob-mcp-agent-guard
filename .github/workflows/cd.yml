name: CD — Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "web-next/**"
      - "docs/ARCHITECTURE-front.md"
      - "PENDING-front.md"
  workflow_dispatch: {}

# Requires repo-level configuration a human sets up once — see docs/DEPLOY.md.
# Variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID       e.g. testmind-ai-hackathon
#   GCP_REGION           e.g. us-central1
#   GAR_REPOSITORY       Artifact Registry repo name, e.g. repoguard
#   CLOUD_RUN_SERVICE    Cloud Run service name, e.g. repoguard
#   WIF_PROVIDER         Workload Identity provider resource name (no secret)
#   DEPLOYER_SA          Service account email this workflow impersonates
# No secrets: auth is Workload Identity Federation (OIDC), no long-lived
# JSON key ever stored in GitHub.

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trims each repo Variable and fails loud on anything empty, instead of
      # leaking a raw-value typo (e.g. a leading/trailing space pasted into
      # the GitHub UI) into a Docker tag or gcloud flag, where it surfaces as
      # a confusing "invalid reference format" several steps later.
      - name: Normalize and validate repo variables
        run: |
          for NAME in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE WIF_PROVIDER DEPLOYER_SA; do
            VALUE="${!NAME}"
            TRIMMED="$(echo "$VALUE" | xargs)"
            if [ -z "$TRIMMED" ]; then
              echo "::error::Repo variable $NAME is unset or blank — see docs/DEPLOY.md §2." >&2
              exit 1
            fi
            if [ "$VALUE" != "$TRIMMED" ]; then
              echo "::warning::Repo variable $NAME had leading/trailing whitespace — trimmed to '$TRIMMED'."
            fi
            echo "$NAME=$TRIMMED" >> "$GITHUB_ENV"
          done
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/repoguard:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # web-next's Vercel deployment (Phase 14) calling this API in the
          # browser — no localhost origin needed here, that's only for local
          # dev against a local `repoguard serve` (already covered by
          # web/server.py's own default).
          env_vars: REPOGUARD_CORS_ORIGINS=https://ibm-bob-mcp-agent-guard.vercel.app
          flags: --allow-unauthenticated

      - name: Show live URL
        run: echo "Deployed — check the Cloud Run console or the deploy step output above for the service URL."
