name: Frontend CI

# Frontend only — path-filtered so a backend-only change (repoguard_engine/,
# demo-repo/, scripts/) doesn't trigger a Node install/build; see ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "web-next/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "web-next/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
