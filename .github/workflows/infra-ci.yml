name: Infra CI

# infra/terraform only — fmt + validate, no credentials and no plan/apply
# (that needs real GCP auth and stays a human step, same as docs/DEPLOY.md).
on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra-ci.yml"

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt check
        run: terraform fmt -check -recursive

      - name: init (no backend, no credentials)
        run: terraform init -backend=false

      - name: validate
        run: terraform validate
