name: CI

# Backend only — path-filtered so a frontend-only change (web-next/) doesn't
# trigger a Python/mutation run; see .github/workflows/frontend-ci.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "web-next/**"
      - "docs/ARCHITECTURE-front.md"
      - "PENDING-front.md"
  pull_request:
    paths-ignore:
      - "web-next/**"
      - "docs/ARCHITECTURE-front.md"
      - "PENDING-front.md"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase0 (package installs, CLI works)
        run: python scripts/verify.py phase0

      - name: Verify phase7 (MCP compact responses)
        run: python scripts/verify.py phase7

      - name: Demo-repo test suite
        run: |
          cd demo-repo
          python -m pytest -q

      - name: Coverage gate on demo-repo
        # Current measured baseline is 65.1% (AGENTS.md §7) — the threshold is
        # set just under that, not at an aspirational 80%, so this gate fails
        # on a real regression instead of always failing or never firing.
        run: repoguard gate demo-repo --threshold 60

  mutation-determinism:
    runs-on: ubuntu-latest
    # Two full mutation runs on demo-repo (~79 mutants each); slower than the
    # rest of CI, kept as its own job so a slow run doesn't block the fast
    # feedback from quality-gate above.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase3 (mutation engine determinism)
        run: python scripts/verify.py phase3

  store:
    runs-on: ubuntu-latest
    # Phase 17 measurement-history store. The jobs above install plain `.`
    # (no [db] extra) -- that's the proof the store stays inert without it.
    # This one installs [db] and checks the same round trip twice, on SQLite
    # and on a real Postgres 16: a SQLite PASS alone isn't proof Postgres works.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repoguard
          POSTGRES_PASSWORD: repoguard
          POSTGRES_DB: repoguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repoguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REPOGUARD_TEST_DATABASE_URL: postgresql+psycopg://repoguard:repoguard@localhost:5432/repoguard_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard with the [db] extra
        run: pip install -e ".[db]"

      - name: Verify phase17-store (SQLite + Postgres round trip)
        run: python scripts/verify.py phase17-store

      - name: Verify phase17-pipeline (persisting can't change a measurement)
        run: python scripts/verify.py phase17-pipeline
