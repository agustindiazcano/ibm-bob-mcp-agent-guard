name: CI

# Backend only — path-filtered so a frontend-only change (web-next/) doesn't
# trigger a Python/mutation run; see .github/workflows/frontend-ci.yml.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "web-next/**"
      - "docs/ARCHITECTURE-front.md"
      - "PENDING-front.md"
  pull_request:
    paths-ignore:
      - "web-next/**"
      - "docs/ARCHITECTURE-front.md"
      - "PENDING-front.md"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase0 (package installs, CLI works)
        run: python scripts/verify.py phase0

      - name: Verify phase7 (MCP compact responses)
        run: python scripts/verify.py phase7

      - name: Demo-repo test suite
        run: |
          cd demo-repo
          python -m pytest -q

      - name: Coverage gate on demo-repo
        # Current measured baseline is 60.3% (AGENTS.md §7) — the threshold is
        # set just under that, not at an aspirational 80%, so this gate fails
        # on a real regression instead of always failing or never firing.
        run: repoguard gate demo-repo --threshold 60.0

  mutation-determinism:
    runs-on: ubuntu-latest
    # Two full mutation runs on demo-repo (~79 mutants each); slower than the
    # rest of CI, kept as its own job so a slow run doesn't block the fast
    # feedback from quality-gate above.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase3 (mutation engine determinism)
        run: python scripts/verify.py phase3

  fix-loop-stub:
    runs-on: ubuntu-latest
    # The sequential fix loop end to end with a scripted provider (no AI
    # credentials): real tools, real risk planner, two real mutation runs on
    # a temp copy of demo-repo. Own job for the same reason as above.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase18-seq-stub (fix loop, scripted provider)
        run: python scripts/verify.py phase18-seq-stub

  engine-parallel-mutation:
    runs-on: ubuntu-latest
    # Phase 18 S1 (parallel mutation workers, file scope, sham-mutant guard)
    # and Phase 17 A2 / Phase 18 S2 (per-mutant records + stable fingerprints,
    # per-test JUnit outcomes). Own job for the same reason as the other
    # mutation-heavy checks above: several full mutation runs, slower than
    # the fast quality-gate job. No [db] extra needed -- these checks never
    # touch the store.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase18-s1 (parallel mutation workers, file scope)
        run: python scripts/verify.py phase18-s1

      - name: Verify phase17-engine (per-mutant records, per-test outcomes)
        run: python scripts/verify.py phase17-engine

  store:
    runs-on: ubuntu-latest
    # Phase 17 measurement-history store. The jobs above install plain `.`
    # (no [db] extra) -- that's the proof the store stays inert without it.
    # This one installs [db] and checks the same round trip twice, on SQLite
    # and on a real Postgres 16: a SQLite PASS alone isn't proof Postgres works.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repoguard
          POSTGRES_PASSWORD: repoguard
          POSTGRES_DB: repoguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repoguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REPOGUARD_TEST_DATABASE_URL: postgresql+psycopg://repoguard:repoguard@localhost:5432/repoguard_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard with the [db] extra
        run: pip install -e ".[db]"

      - name: Verify phase17-store (SQLite + Postgres round trip)
        run: python scripts/verify.py phase17-store

      - name: Verify phase17-pipeline (persisting can't change a measurement)
        run: python scripts/verify.py phase17-pipeline

      - name: Verify phase17-endpoints (GET /api/projects/{slug}/endpoints)
        run: python scripts/verify.py phase17-endpoints

      - name: Verify phase17-api (history read routes, ingest tokens, analyze --push)
        run: python scripts/verify.py phase17-api

      - name: Verify phase17-mutants-tests (per-mutant/test records in store)
        run: python scripts/verify.py phase17-mutants-tests

      - name: Verify phase17-history-routes (operators, survivors, flaky routes)
        run: python scripts/verify.py phase17-history-routes

      - name: Verify autofix-ratelimit (per-IP + global caps, in-memory and SQLite)
        run: python scripts/verify.py autofix-ratelimit

  guardrails-phase19:
    runs-on: ubuntu-latest
    # Phase 19 fix-loop guardrails: G1 env allow-list, G2 static AST policy,
    # and G3 per-file acceptance gate (canary, repetition, preservation).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase19-env (G1 env allow-list)
        run: python scripts/verify.py phase19-env

      - name: Verify phase19-policy (G2 static policy AST)
        run: python scripts/verify.py phase19-policy

      - name: Verify phase19-accept (G3 per-file acceptance gate)
        run: python scripts/verify.py phase19-accept

      - name: Verify phase19-e3 (held-out fixture eval-fixtures/ledger)
        run: python scripts/verify.py phase19-e3

  swarm-phase18:
    runs-on: ubuntu-latest
    # Phase 18 S4: multi-agent swarm lane state machine, thread pool,
    # blackboard files, timeline, and error handling.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repoguard
        run: pip install -e .

      - name: Verify phase18-s4 (swarm lane state machine + runner)
        run: python scripts/verify.py phase18-s4

