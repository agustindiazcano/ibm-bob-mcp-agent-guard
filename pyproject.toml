[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard"
version = "0.1.0"
description = "AI-powered test quality guard for Python repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn[standard]>=0.29",
    "fastmcp>=0.4",
    "pytest>=8",
    "pytest-cov>=5",
    "coverage[toml]>=7",
    "click>=8",
    "rich>=13",
    "httpx>=0.27",
    "playwright>=1.44",
    "pillow>=10",
]

[project.optional-dependencies]
# Only for regenerating docs/img/*.png (docs/make_results_chart.py); the CLI
# and MCP server never import matplotlib, so it stays out of the core deps.
docs = ["matplotlib>=3.8"]

[project.scripts]
repoguard = "repoguard_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repoguard_engine*"]

[tool.coverage.run]
branch = true
source = ["repoguard_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
