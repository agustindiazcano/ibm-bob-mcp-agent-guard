[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "repoguard"
version = "0.1.0"
description = "AI-powered test quality guard for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "fastmcp>=0.4",
    "pytest>=8",
    "pytest-cov>=5",
    "coverage[toml]>=7",
    "click>=8",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
repoguard = "repoguard_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repoguard_engine*"]

[tool.coverage.run]
branch = true
source = ["repoguard_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
