[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard"
version = "0.1.0"
description = "AI-powered test quality guard for Python repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn[standard]>=0.29",
    "fastmcp>=0.4",
    "pytest>=8",
    "pytest-cov>=5",
    "coverage[toml]>=7",
    "click>=8",
    "rich>=13",
    "httpx>=0.27",
    "playwright>=1.44",
    "pillow>=10",
    "axe-playwright-python>=0.1.3",
]

[project.optional-dependencies]
# Only for regenerating docs/img/*.png (docs/make_results_chart.py); the CLI
# and MCP server never import matplotlib, so it stays out of the core deps.
docs = ["matplotlib>=3.8"]
# Only for narrative.py / `repoguard analyze --summarize` / tool_generate_summary.
# Everything else (measurement, CLI, MCP tools 1-8) works with zero AI calls
# and zero credentials, so this stays out of the core deps too.
ai = ["ibm-watsonx-ai>=1.7"]
# REPOGUARD_AI_PROVIDER=vertex / --provider vertex. Credentials via
# Application Default Credentials (gcloud auth application-default login)
# or GOOGLE_APPLICATION_CREDENTIALS -- see docs/VERTEX_SETUP.md.
vertex = ["google-genai>=2.25"]
# Run history (repoguard_engine/store/): only when REPOGUARD_DATABASE_URL is
# set, or for `repoguard db ...` / serving the history routes. SQLite needs
# nothing else; psycopg is the PostgreSQL (Cloud SQL) driver. `repoguard
# analyze --push` works without this extra.
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]

[project.scripts]
repoguard = "repoguard_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repoguard_engine*"]

[tool.coverage.run]
branch = true
source = ["repoguard_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
