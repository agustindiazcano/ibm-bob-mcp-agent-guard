<!DOCTYPE html>
<html lang="en">
<head>

  <title>Demo Shop</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }

  </style>
</head>
<body>
  <h1>🛒 Demo Shop</h1>

  <div class="product">
    <strong>Widget A</strong> — $9.99
    <button onclick="alert('Added!')">Add to cart</button>
  </div>
  <div class="product">
    <strong>Gadget B</strong> — $24.99
    <button onclick="alert('Added!')">Add to cart</button>
  </div>
</body>
</html>
